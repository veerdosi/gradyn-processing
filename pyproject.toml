[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradyn-processing"
version = "0.2.0"
description = "Mac-native egocentric video processing pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "pillow>=10",
  "pyarrow>=15",
  "scipy>=1.11",
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13",
]

[project.scripts]
gradyn = "gradyn.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
